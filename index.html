<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Calendar Section -->
        <div class="calendar-section">
            <div class="container">
                <div class="header">
                    <h1>📅 My Daily Journal</h1>
                    <div class="nav">
                        <button onclick="prevMonth()">← Previous</button>
                        <span class="month-year" id="monthYear"></span>
                        <button onclick="nextMonth()">Next →</button>
                        <button class="today-btn" onclick="goToToday()">Today</button>
                        <button class="today-btn" onclick="triggerDirectExport()">Export</button>
                    </div>
                </div>

                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </div>
        </div>

        <!-- Simplified Journal Panel -->
        <div class="journal-panel hidden" id="journalPanel">
            <div class="notebook-page">
                <!-- Cherry blossom decoration -->
                <div class="cherry-decoration">🌸</div>
                
                <div class="journal-header">
                    <div class="header-top">
                        <h2 class="title" id="journalPanelTitle">Daily Log</h2>
                        <div class="date-display" id="selectedDateDisplay">Select a day</div>
                    </div>
                    <button class="close-panel" onclick="closeJournalPanel()">×</button>
                </div>

                <div class="main-content">
                    <div class="emoji-row">
                        <button class="emoji-btn" data-emoji="💊" title="Medication">💊</button>
                        <button class="emoji-btn" data-emoji="🍽️" title="Food/Meal">🍽️</button>
                        <button class="emoji-btn" data-emoji="💧" title="Drink/Water">💧</button>
                        <button class="emoji-btn" data-emoji="🚽" title="Bathroom">🚽</button>
                        <button class="emoji-btn" data-emoji="😴" title="Sleep/Rest">😴</button>
                        <button class="emoji-btn" data-emoji="🌡️" title="Symptoms">🌡️</button>
                        <button class="emoji-btn" data-emoji="🚶‍♀️" title="Activity">🚶‍♀️</button>
                        <button class="emoji-btn" data-emoji="😷" title="Medical">😷</button>
                        <button class="emoji-btn" data-emoji="😊" title="Mood">😊</button>
                        <button class="emoji-btn" data-emoji="📝" title="Note">📝</button>
                    </div>

                    <div class="entry-section">
                        <div class="entry-form">
                            <div class="selected-emoji-display" id="selectedEmoji">📝</div>
                            <input type="time" class="time-input" id="entryTime" placeholder="Time">
                            <button class="now-btn" onclick="setCurrentTime()">Now</button>
                            <input type="text" class="note-input" id="noteInput" placeholder="What happened? Add details here...">
                            <button class="add-btn" onclick="addLogEntry()">Add</button>
                        </div>

                        <div class="entries-list" id="entriesList">
                            <div class="empty-state">
                                Start logging your day by selecting an emoji, time, and adding a note above.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
