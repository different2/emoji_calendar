<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Calendar Section -->
        <div class="calendar-section">
            <div class="container">
                <div class="header">
                    <h1>📅 My Daily Journal</h1>
                    <div class="nav">
                        <button onclick="prevMonth()">← Previous</button>
                        <span class="month-year" id="monthYear"></span>
                        <button onclick="nextMonth()">Next →</button>
                        <button class="today-btn" onclick="goToToday()">Today</button>
                        <button class="today-btn" onclick="triggerDirectExport()">Export</button>
                    </div>
                </div>

                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </div>
        </div>

        <!-- Journal Panel -->
        <div class="journal-panel hidden" id="journalPanel">
            <div class="journal-header">
                <h2 id="journalPanelTitle">Select a day to start logging</h2>
                <button class="close-panel" onclick="closeJournalPanel()">×</button>
            </div>
            
            <div class="journal-content" id="journalContent">
                <div class="journal-date-display">
                    <h3 id="selectedDateDisplay">No date selected</h3>
                </div>

                <!-- Add New Entry Section -->
                <div class="add-entry-section">
                    <h4>➕ Add New Entry</h4>
                    
                    <div class="time-input-section">
                        <label>Time:</label>
                        <div class="time-input-group">
                            <input type="time" id="entryTime" placeholder="Enter time...">
                            <button type="button" class="current-time-btn" onclick="setCurrentTime()">Now</button>
                        </div>
                    </div>

                    <div class="category-section">
                        <label>Category (optional):</label>
                        <div class="category-buttons">
                            <button type="button" class="category-tag" onclick="selectCategory('💊', 'Medication')">💊 Medication</button>
                            <button type="button" class="category-tag" onclick="selectCategory('🍽️', 'Food/Drink')">🍽️ Food/Drink</button>
                            <button type="button" class="category-tag" onclick="selectCategory('🚽', 'Bathroom')">🚽 Bathroom</button>
                            <button type="button" class="category-tag" onclick="selectCategory('😴', 'Sleep')">😴 Sleep</button>
                            <button type="button" class="category-tag" onclick="selectCategory('🌡️', 'Symptoms')">🌡️ Symptoms</button>
                            <button type="button" class="category-tag" onclick="selectCategory('📝', 'Note')">📝 Note</button>
                        </div>
                        <div class="custom-category">
                            <input type="text" id="customCategory" placeholder="Or type custom category...">
                        </div>
                    </div>

                    <div class="entry-content-section">
                        <label>Details:</label>
                        <textarea id="entryDetails" placeholder="What happened? Details, dosage, amount, observations, etc..."></textarea>
                    </div>

                    <div class="entry-actions">
                        <button class="btn btn-primary" onclick="addLogEntry()">Add Entry</button>
                    </div>
                </div>

                <!-- Existing Entries for This Day -->
                <div class="existing-entries-section">
                    <h4>📋 Today's Log</h4>
                    <div id="entriesList" class="entries-list">
                        <p class="no-entries-message">No entries for this day yet.</p>
                    </div>
                </div>

                <!-- Quick Stats Section -->
                <div class="stats-section">
                    <h4>📊 Quick Summary</h4>
                    <div id="quickStats" class="quick-stats">
                        <!-- Will be populated with entry counts -->
                    </div>
                </div>

                <!-- Daily Notes Section -->
                <div class="journal-section">
                    <h4>💭 Daily Notes</h4>
                    <textarea id="dailyNotes" placeholder="Overall notes for the day, observations, how she's feeling, etc..."></textarea>
                </div>
            </div>

            <div class="journal-actions">
                <button class="btn btn-delete" id="deleteJournalBtn" onclick="deleteJournalEntry()" style="display: none;">Delete All</button>
                <button class="btn btn-secondary" onclick="clearJournalForm()">Clear Form</button>
                <button class="btn btn-primary" onclick="saveJournalEntry()">Save Daily Notes</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
