<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
        }

        .nav button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .month-year {
            font-size: 1.8em;
            font-weight: 500;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            margin: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .day-header {
            background: #f5f5f5;
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }

        .day {
            background: white;
            min-height: 120px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .day:hover {
            background: #f8f9ff;
            border-color: #4facfe;
        }

        .day.other-month {
            background: #f9f9f9;
            color: #ccc;
        }

        .day.today {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .day.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .day-events {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .event {
            background: rgba(79, 172, 254, 0.2);
            padding: 3px 6px;
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event:hover {
            background: rgba(79, 172, 254, 0.4);
            transform: scale(1.02);
        }

        .event-emoji {
            font-size: 12px;
            flex-shrink: 0;
        }

        .event-title {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selected .event {
            background: rgba(255, 255, 255, 0.3);
        }

        .today .event {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 0;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .time-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .time-input-group input {
            flex: 1;
        }

        .current-time-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .current-time-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .emoji-section {
            margin-bottom: 20px;
        }

        .emoji-search {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .emoji-search:focus {
            outline: none;
            border-color: #4facfe;
        }

        .emoji-categories {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .category-btn.active {
            background: #4facfe;
            color: white;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
        }

        .emoji-btn {
            background: none;
            border: 2px solid transparent;
            padding: 8px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
        }

        .emoji-btn:hover {
            background: rgba(79, 172, 254, 0.1);
            border-color: #4facfe;
        }

        .emoji-btn.selected {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.2);
        }

        .selected-emoji-display {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #f8f9ff;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .selected-emoji-display .emoji {
            font-size: 24px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .timestamp {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                margin: 10px;
            }
            
            .day {
                min-height: 80px;
                padding: 5px;
            }
            
            .modal-content {
                width: 95%;
                margin: 5% auto;
            }
            
            .emoji-grid {
                grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 My Calendar</h1>
            <div class="nav">
                <button onclick="prevMonth()">← Previous</button>
                <span class="month-year" id="monthYear"></span>
                <button onclick="nextMonth()">Next →</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendar">
            <!-- Calendar will be generated here -->
        </div>
    </div>

    <!-- Modal for adding/editing events -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Event</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="eventTitle">Event Title:</label>
                    <input type="text" id="eventTitle" placeholder="Enter event title...">
                </div>

                <div class="form-group">
                    <label for="eventTime">Time:</label>
                    <div class="time-input-group">
                        <input type="time" id="eventTime">
                        <button type="button" class="current-time-btn" onclick="setCurrentTime()">Current Time</button>
                    </div>
                </div>

                <div class="form-group emoji-section">
                    <label>Choose an Emoji:</label>
                    <div class="selected-emoji-display">
                        <span class="emoji" id="selectedEmojiDisplay">📅</span>
                        <span>Selected emoji</span>
                    </div>
                    
                    <input type="text" class="emoji-search" placeholder="Search emojis..." id="emojiSearch">
                    
                    <div class="emoji-categories">
                        <button type="button" class="category-btn active" data-category="all">All</button>
                        <button type="button" class="category-btn" data-category="smileys">😀 Faces</button>
                        <button type="button" class="category-btn" data-category="people">👤 People</button>
                        <button type="button" class="category-btn" data-category="nature">🌿 Nature</button>
                        <button type="button" class="category-btn" data-category="food">🍎 Food</button>
                        <button type="button" class="category-btn" data-category="activities">⚽ Activities</button>
                        <button type="button" class="category-btn" data-category="travel">✈️ Travel</button>
                        <button type="button" class="category-btn" data-category="objects">📱 Objects</button>
                        <button type="button" class="category-btn" data-category="symbols">❤️ Symbols</button>
                    </div>
                    
                    <div class="emoji-grid" id="emojiGrid">
                        <!-- Emojis will be populated here -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventNotes">Notes:</label>
                    <textarea id="eventNotes" placeholder="Add your notes here..."></textarea>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn btn-delete" id="deleteBtn" onclick="deleteEvent()" style="display: none;">Delete</button>
                    <button type="button" class="btn btn-primary" onclick="saveEvent()">Save</button>
                </div>
            </div>
        </div>
    </div>

        };

        // Initialize calendar
        document.addEventListener('DOMContentLoaded', function() {
            renderCalendar();
            setupEventListeners();
            populateEmojiGrid('all');
        });

        function setupEventListeners() {
            // Close modal when clicking outside or on close button
            const modal = document.getElementById('eventModal');
            const closeBtn = document.querySelector('.close');
            
            closeBtn.onclick = closeModal;
            window.onclick = function(event) {
                if (event.target === modal) {
                    closeModal();
                }
            };

            // Category buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.category;
                    populateEmojiGrid(currentCategory);
                };
            });

            // Emoji search
            document.getElementById('emojiSearch').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                populateEmojiGrid(currentCategory, searchTerm);
            });
        }

        function populateEmojiGrid(category, searchTerm = '') {
            const emojiGrid = document.getElementById('emojiGrid');
            emojiGrid.innerHTML = '';
            
            let emojisToShow = [];
            
            if (category === 'all') {
                emojisToShow = Object.values(emojiDatabase).flat();
            } else {
                emojisToShow = emojiDatabase[category] || [];
            }
            
            // Filter by search term if provided
            if (searchTerm) {
                emojisToShow = emojisToShow.filter(emoji => {
                    // You could add emoji names/descriptions here for better search
                    return true; // For now, just show all emojis
                });
            }
            
            emojisToShow.forEach(emoji => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'emoji-btn';
                btn.textContent = emoji;
                btn.onclick = function() {
                    selectEmoji(emoji);
                };
                emojiGrid.appendChild(btn);
            });
        }

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            document.getElementById('selectedEmojiDisplay').textContent = emoji;
            
            // Update visual selection
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.textContent === emoji);
            });
        }

        function setCurrentTime() {
            const now = new Date();
            const timeString = now.toTimeString().slice(0, 5);
            document.getElementById('eventTime').value = timeString;
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            const monthYear = document.getElementById('monthYear');
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = new Intl.DateTimeFormat('en-US', { 
                month: 'long', 
                year: 'numeric' 
            }).format(currentDate);
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            const today = new Date();
            
            // Clear calendar
            calendar.innerHTML = '';
            
            // Add day headers
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendar.appendChild(header);
            });
            
            // Add days
            const currentDateCopy = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = currentDateCopy.getDate();
                
                const dayEvents = document.createElement('div');
                dayEvents.className = 'day-events';
                
                if (currentDateCopy.getMonth() !== month) {
                    dayElement.classList.add('other-month');
                } else if (
                    currentDateCopy.getDate() === today.getDate() &&
                    currentDateCopy.getMonth() === today.getMonth() &&
                    currentDateCopy.getFullYear() === today.getFullYear()
                ) {
                    dayElement.classList.add('today');
                }
                
                const dateKey = formatDateKey(currentDateCopy);
                if (events[dateKey]) {
                    events[dateKey].forEach(event => {
                        const eventElement = document.createElement('div');
                        eventElement.className = 'event';
                        
                        const eventEmoji = document.createElement('span');
                        eventEmoji.className = 'event-emoji';
                        eventEmoji.textContent = event.emoji;
                        
                        const eventTitle = document.createElement('span');
                        eventTitle.className = 'event-title';
                        let titleText = event.title;
                        if (event.time) {
                            titleText = `${event.time} ${titleText}`;
                        }
                        eventTitle.textContent = titleText;
                        
                        eventElement.appendChild(eventEmoji);
                        eventElement.appendChild(eventTitle);
                        
                        eventElement.onclick = (e) => {
                            e.stopPropagation();
                            editEvent(dateKey, event.id);
                        };
                        dayEvents.appendChild(eventElement);
                    });
                }
                
                dayElement.appendChild(dayNumber);
                dayElement.appendChild(dayEvents);
                
                dayElement.onclick = () => selectDate(currentDateCopy, dayElement);
                
                calendar.appendChild(dayElement);
                currentDateCopy.setDate(currentDateCopy.getDate() + 1);
            }
        }

        function selectDate(date, element) {
            // Remove previous selection
            document.querySelectorAll('.day.selected').forEach(day => {
                day.classList.remove('selected');
            });
            
            // Add selection to clicked day
            element.classList.add('selected');
            selectedDate = new Date(date);
            
            // Open modal for new event
            openModal();
        }

        function openModal(isEdit = false) {
            const modal = document.getElementById('eventModal');
            const modalTitle = document.getElementById('modalTitle');
            const deleteBtn = document.getElementById('deleteBtn');
            
            modalTitle.textContent = isEdit ? 'Edit Event' : 'Add Event';
            deleteBtn.style.display = isEdit ? 'inline-block' : 'none';
            
            if (!isEdit) {
                // Clear form for new event
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventTime').value = '';
                document.getElementById('eventNotes').value = '';
                selectedEmoji = '📅';
                document.getElementById('selectedEmojiDisplay').textContent = selectedEmoji;
                document.getElementById('emojiSearch').value = '';
                currentCategory = 'all';
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.category === 'all');
                });
                populateEmojiGrid('all');
            }
            
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            editingEventId = null;
        }

        function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const notes = document.getElementById('eventNotes').value.trim();
            
            if (!title) {
                alert('Please enter an event title');
                return;
            }
            
            const dateKey = formatDateKey(selectedDate);
            
            if (!events[dateKey]) {
                events[dateKey] = [];
            }
            
            const eventData = {
                id: editingEventId || Date.now(),
                title: title,
                emoji: selectedEmoji,
                time: time,
                notes: notes,
                timestamp: new Date().toLocaleString()
            };
            
            if (editingEventId) {
                // Update existing event
                const eventIndex = events[dateKey].findIndex(e => e.id === editingEventId);
                if (eventIndex !== -1) {
                    events[dateKey][eventIndex] = eventData;
                }
            } else {
                // Add new event
                events[dateKey].push(eventData);
            }
            
            renderCalendar();
            closeModal();
        }

        function editEvent(dateKey, eventId) {
            const event = events[dateKey].find(e => e.id === eventId);
            if (!event) return;
            
            // Parse the date key back to a date
            const [year, month, day] = dateKey.split('-').map(Number);
            selectedDate = new Date(year, month, day);
            editingEventId = eventId;
            
            // Fill form with event data
            document.getElementById('eventTitle').value = event.title;
            document.getElementById('eventTime').value = event.time || '';
            document.getElementById('eventNotes').value = event.notes || '';
            selectedEmoji = event.emoji;
            document.getElementById('selectedEmojiDisplay').textContent = selectedEmoji;
            
            // Update emoji selection in grid
            populateEmojiGrid(currentCategory);
            setTimeout(() => {
                document.querySelectorAll('.emoji-btn').forEach(btn => {
                    btn.classList.toggle('selected', btn.textContent === selectedEmoji);
                });
            }, 100);
            
            openModal(true);
        }

        function deleteEvent() {
            if (!editingEventId) return;
            
            const dateKey = formatDateKey(selectedDate);
            if (events[dateKey]) {
                events[dateKey] = events[dateKey].filter(e => e.id !== editingEventId);
                if (events[dateKey].length === 0) {
                    delete events[dateKey];
                }
            }
            
            renderCalendar();
            closeModal();
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }
    </script>
